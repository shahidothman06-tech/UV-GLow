org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Google Play Billing product IDs. Leave empty to keep the Premium screen in clearly
# labelled demo mode. Fill these in once the subscriptions exist in Play Console.
uvglow.billing.monthlyProductId=uvglow_premium_monthly

# AdMob IDs for RELEASE builds (debug builds always use Google's test IDs).
# Leave either blank to ship a release without ads.
ADMOB_APP_ID=
ADMOB_BANNER_ID=
